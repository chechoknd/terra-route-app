services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: ${API_DATABASE_URL:-postgres://terraroute:terraroute_dev_password@postgres:5432/terraroute?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-for-local-development}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
    ports:
      - "${API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terraroute}
      POSTGRES_USER: ${POSTGRES_USER:-terraroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terraroute_dev_password}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: migrate/migrate:4
    profiles:
      - tools
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=${API_DATABASE_URL:-postgres://terraroute:terraroute_dev_password@postgres:5432/terraroute?sslmode=disable}
      - up
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
